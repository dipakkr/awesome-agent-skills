<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentation</title><style>
:root{--ink:#203330;--muted:#6c7774;--line:#dce3df;--paper:#f1f4f1;--accent:#206d61}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}button,a{ -webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit;background:white;border:1px solid var(--line);border-radius:8px;padding:9px 13px}button:hover{border-color:#8aaba1;background:#f4f8f5}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #318b7b;outline-offset:2px}button.active,button.primary{background:var(--accent);border-color:var(--accent);color:white}#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:66px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}.brand{width:30px;height:30px;display:grid;place-items:center;background:var(--accent);color:white;border-radius:8px;font-weight:700;font-size:13px}.identity{min-width:0;flex:1}.identity strong{display:block;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.identity small{display:block;font-size:10px;color:var(--muted);margin-top:4px}#toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.editOnly{display:none}.editing .editOnly{display:initial}#workspace{display:flex;align-items:flex-start}#sidebar{display:none;position:sticky;top:66px;width:214px;flex-shrink:0;max-height:calc(100vh - 66px);overflow:auto;background:#fbfcfa;border-right:1px solid var(--line);padding:20px 12px}.editing #sidebar{display:block}.sidebarTitle{font-size:11px;color:var(--muted);margin:0 6px 16px;text-transform:uppercase;letter-spacing:1px}#thumbs{display:flex;flex-direction:column;gap:16px}.thumbnail{display:block;width:100%;padding:5px;text-align:left;border-radius:7px;background:white}.thumbnail[aria-current=true]{border:2px solid var(--accent);padding:4px}.mini{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;pointer-events:none}.mini .slide{transform-origin:top left;transform:scale(var(--scale,.14))}.thumbnail small{display:block;padding:8px 3px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--muted)}#canvas{flex:1;min-width:0;padding:38px 4.5vw 110px;display:flex;flex-direction:column;align-items:center;gap:30px}.card{width:100%;max-width:1180px;scroll-margin-top:92px}.cardMeta{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px;line-height:1.5;padding:0 3px 10px}.cardMeta span{max-width:80%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.cardMeta button{border:0;background:transparent;font-size:11px;padding:3px 6px}.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;box-shadow:0 4px 22px #2033300b;outline:1px solid #20333012;background:white}.frame .slide{transform:scale(var(--scale,1));transform-origin:top left}.slide{position:relative;width:1280px;height:720px;overflow:hidden}.obj{position:absolute}.text{margin:0;white-space:pre-wrap;line-height:1.08;overflow-wrap:break-word}.text[contenteditable=true]{outline:1px dashed #668e86;outline-offset:3px;cursor:text}.image{object-fit:cover}.speakerNotes{padding:18px 22px;margin-top:14px;border-left:3px solid #94b7a8;background:#fff;color:#52665f;font-size:13px;line-height:1.7;white-space:pre-wrap;border-radius:0 7px 7px 0}#dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 30px #15251f24;z-index:30}.editing #dock{display:none}#dock button{white-space:nowrap}#dock .key{margin-left:12px;color:#759189;font-size:10px}#status{font-size:11px;color:var(--muted)}#stage,#playback{display:none}.presenting{background:#17231f;overflow:hidden}.presenting #topbar,.presenting #workspace,.presenting #dock{display:none}.presenting #stage{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:white}.presenting #stage .slide{transform-origin:top left}.presenting #playback{display:flex;align-items:center;gap:8px;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:7px;background:#fff;border:1px solid #c8d2ce;border-radius:12px;box-shadow:0 6px 24px #0004;z-index:40}#counter{font-size:12px;min-width:55px;text-align:center;font-variant-numeric:tabular-nums}#playback button{white-space:nowrap}#exit{margin-left:12px}.capture{background:white}.capture #topbar,.capture #workspace,.capture #dock,.capture #playback{display:none!important}.capture #stage{display:block;position:relative;margin:auto;overflow:hidden;background:white}.capture #stage .slide{transform-origin:top left}#print-root{display:none}
@media(max-width:700px){#topbar{padding:12px;gap:10px;flex-wrap:wrap}.identity{min-width:180px}#toolbar{gap:5px}#toolbar button{font-size:11px;padding:8px}.editing #workspace{display:block}.editing #sidebar{position:relative;top:0;width:100%;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:10px}.sidebarTitle{display:none}#thumbs{flex-direction:row;overflow:auto;gap:10px}.thumbnail{width:140px;flex-shrink:0}#canvas{padding:24px 14px 100px;gap:25px}.frame{border-radius:6px}.cardMeta{font-size:9px}.speakerNotes{font-size:12px;padding:14px}#dock{bottom:16px}#playback{bottom:12px!important;gap:4px!important;padding:5px!important}#playback button{font-size:11px;padding:9px}#exit{margin-left:3px}.presenting #stage{top:47%}.brand{width:26px;height:26px}.identity strong{font-size:12px}#status{font-size:10px}}
@page{size:13.333333in 7.5in;margin:0}@media print{body{background:white}#topbar,#workspace,#dock,#stage,#playback{display:none!important}#print-root{display:block}.print-slide{position:relative;width:1280px;height:720px;break-after:page;overflow:hidden;print-color-adjust:exact;-webkit-print-color-adjust:exact}.print-slide:last-child{break-after:auto}}
</style></head><body>
<header id="topbar"><span class="brand" aria-hidden="true">cd</span><div class="identity"><strong id="title"></strong><small id="subtitle">Presentation</small></div><span id="status" role="status"></span><div id="toolbar"><button class="editOnly" id="undo" disabled>Undo</button><button class="editOnly" id="redo" disabled>Redo</button><button class="editOnly" id="done">Done</button><button id="save">Save HTML</button><button class="editOnly" id="json">Save JSON</button><button id="print">Print / PDF</button><button class="editOnly primary" id="present-top">Present</button></div></header>
<div id="workspace"><aside id="sidebar" aria-label="Slide navigator"><div class="sidebarTitle">Slides</div><nav id="thumbs"></nav></aside><main id="canvas" aria-label="Presentation slides"></main></div>
<nav id="dock" aria-label="Presentation controls"><button id="edit">Edit text <span class="key" aria-hidden="true">E</span></button><button id="present" class="primary">Present <span aria-hidden="true">↗</span></button></nav>
<main id="stage" aria-label="Current slide"></main><nav id="playback" aria-label="Slideshow controls"><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="autoplay">Play</button><button id="exit">Exit · Esc</button></nav><div id="print-root"></div>
<script id="deck-data" type="application/json">__DECK_DATA__</script>
<script>
'use strict';
const deck=JSON.parse(document.getElementById('deck-data').textContent),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),capture=params.has('capture'),canEdit=deck.editable!==false;
let index=Math.max(0,Math.min(deck.slides.length-1,Number(params.get('slide')||1)-1)),editing=false,presenting=params.get('view')==='present',playing=false,timer=null,undoStack=[],redoStack=[],observer=null;
if(!Number.isFinite(index))index=0;
document.title=deck.title;$('title').textContent=deck.title;$('subtitle').textContent=deck.slides.length+' slides · '+(canEdit?'Editable presentation':'Presentation preview');$('status').textContent='';$('edit').hidden=!canEdit;
function slideTitle(s,n){const t=s.objects.find(o=>o.kind==='text'&&o.size>=40);return t?t.text.replace(/\n/g,' '):'Slide '+(n+1);}
function commit(change){if(change.before===change.after)return;undoStack.push(change);if(undoStack.length>100)undoStack.shift();redoStack=[];updateHistory();}
function updateHistory(){$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length;}
function object(o,n,slideNumber,editable){const el=document.createElement(o.kind==='image'?'img':'div');el.className='obj '+(o.kind==='image'?'image':o.kind==='text'?'text':'shape');el.dataset.object=n;Object.assign(el.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px'});
 if(o.kind==='text'){el.textContent=o.text;Object.assign(el.style,{fontSize:(o.size||24)+'px',fontFamily:o.font||deck.font||'Arial',fontStyle:o.italic?'italic':'normal',fontWeight:o.bold?'700':'400',color:o.color||'#111111',textAlign:o.align||'left'});if(editable){el.contentEditable='true';el.setAttribute('aria-label','Slide '+(slideNumber+1)+' text '+(n+1));let before=o.text;el.onfocus=()=>{before=o.text;index=slideNumber;};el.oninput=()=>{o.text=el.innerText;$('status').textContent='Unsaved changes';};el.onblur=()=>commit({slide:slideNumber,object:n,before,after:o.text});}}
 else if(o.kind==='image'){el.src=o.src;el.alt=o.alt||'';}else{el.style.background=o.fill||'#111111';el.style.borderRadius=o.kind==='ellipse'?'50%':(o.radius||0)+'px';if(o.stroke)el.style.border=(o.strokeWidth||2)+'px solid '+o.stroke;}return el;}
function makeSlide(s,n,editable=false,klass='slide'){const el=document.createElement('section');el.className=klass;el.style.background=s.background;s.objects.forEach((o,i)=>el.append(object(o,i,n,editable)));return el;}
function fit(){if(presenting||capture){const z=Math.min(1,innerWidth/1280,(innerHeight-(capture?0:100))/720);$('stage').style.width=1280*z+'px';$('stage').style.height=720*z+'px';if($('stage').firstElementChild)$('stage').firstElementChild.style.transform='scale('+z+')';}else{document.querySelectorAll('.frame,.mini').forEach(el=>el.style.setProperty('--scale',el.clientWidth/1280));}}
function currentThumb(){document.querySelectorAll('.thumbnail').forEach((b,n)=>b.setAttribute('aria-current',String(n===index)));}
function draw(){if(observer)observer.disconnect();document.body.classList.toggle('editing',editing);document.body.classList.toggle('presenting',presenting);document.body.classList.toggle('capture',capture);$('canvas').replaceChildren();$('stage').replaceChildren();$('thumbs').replaceChildren();
 if(presenting||capture){$('stage').append(makeSlide(deck.slides[index],index));$('counter').textContent=(index+1)+' / '+deck.slides.length;}
 else{deck.slides.forEach((s,n)=>{const card=document.createElement('article');card.className='card';card.id='slide-'+(n+1);card.dataset.slide=n;const meta=document.createElement('div');meta.className='cardMeta';const title=document.createElement('span');title.textContent=String(n+1).padStart(2,'0')+' / '+slideTitle(s,n);const notesButton=document.createElement('button');notesButton.textContent='Notes';notesButton.setAttribute('aria-label','Notes for slide '+(n+1));notesButton.setAttribute('aria-expanded','false');meta.append(title,notesButton);const frame=document.createElement('div');frame.className='frame';frame.append(makeSlide(s,n,editing));const notes=document.createElement('aside');notes.className='speakerNotes';notes.textContent=s.notes;notes.hidden=true;notesButton.onclick=()=>{notes.hidden=!notes.hidden;notesButton.setAttribute('aria-expanded',String(!notes.hidden));};card.append(meta,frame,notes);$('canvas').append(card);
 if(editing){const button=document.createElement('button');button.className='thumbnail';button.setAttribute('aria-label','Slide '+(n+1)+': '+slideTitle(s,n));const mini=document.createElement('div');mini.className='mini';mini.setAttribute('aria-hidden','true');mini.append(makeSlide(s,n));const label=document.createElement('small');label.textContent=(n+1)+'  '+slideTitle(s,n);button.append(mini,label);button.onclick=()=>{index=n;currentThumb();card.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});};$('thumbs').append(button);}});
 observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){index=Number(e.target.dataset.slide);currentThumb();}},{rootMargin:'-15% 0px -55% 0px'});document.querySelectorAll('.card').forEach(el=>observer.observe(el));currentThumb();}
 fit();updateHistory();}
function stop(){playing=false;$('counter').setAttribute('aria-live','polite');clearInterval(timer);timer=null;$('autoplay').textContent='Play';$('autoplay').setAttribute('aria-label','Play slideshow');}
function play(){playing=true;$('counter').setAttribute('aria-live','off');$('autoplay').textContent='Pause';$('autoplay').setAttribute('aria-label','Pause slideshow');clearInterval(timer);timer=setInterval(()=>{if(document.visibilityState==='visible')move(1,false);},3000);}
function move(delta,manual=true){if(manual)stop();index=(index+delta+deck.slides.length)%deck.slides.length;draw();}
function present(){editing=false;presenting=true;stop();draw();}
function edit(){if(!canEdit)return;presenting=false;editing=true;stop();draw();document.getElementById('slide-'+(index+1))?.scrollIntoView({block:'start'});}
function exitPresent(){presenting=false;stop();draw();document.getElementById('slide-'+(index+1))?.scrollIntoView({block:'start'});}
function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
const filename=()=>deck.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'presentation';
$('edit').onclick=edit;$('done').onclick=()=>{editing=false;draw();};$('present').onclick=present;$('present-top').onclick=present;$('exit').onclick=exitPresent;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('autoplay').onclick=()=>playing?stop():play();
function historyStep(from,to,key){const c=from.pop();if(!c)return;deck.slides[c.slide].objects[c.object].text=c[key];to.push(c);index=c.slide;draw();$('status').textContent='Unsaved changes';}
$('undo').onclick=()=>historyStep(undoStack,redoStack,'before');$('redo').onclick=()=>historyStep(redoStack,undoStack,'after');
$('save').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#deck-data').textContent=JSON.stringify(deck).replace(/</g,'\\u003c');for(const id of ['canvas','stage','thumbs','print-root'])clone.querySelector('#'+id).replaceChildren();clone.querySelector('body').className='';clone.querySelector('#status').textContent='';download('<!doctype html>\n'+clone.outerHTML,filename()+'.html','text/html');$('status').textContent='HTML copy saved';};
$('json').onclick=()=>download(JSON.stringify(deck,null,2),filename()+'.json','application/json');
$('print').onclick=()=>{$('print-root').replaceChildren(...deck.slides.map((s,n)=>makeSlide(s,n,false,'print-slide')));window.print();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&presenting){e.preventDefault();exitPresent();return;}if(e.target.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(presenting&&e.key==='ArrowRight'){e.preventDefault();move(1);}else if(presenting&&e.key==='ArrowLeft'){e.preventDefault();move(-1);}else if(presenting&&e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();playing?stop():play();}else if(!presenting&&e.key.toLowerCase()==='e'){edit();}});
window.addEventListener('resize',fit);draw();
</script></body></html>
