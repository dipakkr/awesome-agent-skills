<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e9e3;color:#263a31;font:14px system-ui,sans-serif}.stage{position:relative;width:100%;height:min(75vw,590px);min-height:330px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none;position:relative;z-index:1}.shadow{position:absolute;left:25%;width:50%;height:6%;bottom:17%;background:#65706055;border-radius:50%;filter:blur(14px)}.label{position:absolute;z-index:2;top:22px;left:24px;font-size:11px;letter-spacing:2px;pointer-events:none}.status{position:absolute;z-index:2;top:20px;right:22px;border:1px solid #9aa99c;border-radius:30px;padding:5px 9px;font-size:10px}.controls{padding:20px 24px;background:#f6f6f1;border-top:1px solid #ccd3c8;display:grid;grid-template-columns:1fr 1fr;gap:18px}h1{font:28px Georgia,serif;margin:0 0 8px}p{line-height:1.5;color:#617064;margin:6px 0;font-size:12px}button,a{border:1px solid #b8c3b8;border-radius:7px;background:transparent;padding:8px 11px;color:#263a31;font:12px system-ui;cursor:pointer;display:inline-block;text-decoration:none;margin:7px 4px 0 0}label{font-size:12px;display:block}input{width:100%;accent-color:#536f59;margin:12px 0}.note{grid-column:1/-1;font-size:11px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #354c3c;outline-offset:3px}@media(max-width:480px){.controls{grid-template-columns:1fr;padding:16px}.label{left:16px;max-width:calc(100% - 140px);font-size:9px;letter-spacing:1px;line-height:1.4}.status{right:16px}.stage{height:360px}.controls h1{font-size:24px}}
</style></head><body><div class="stage"><div class="label">PRINTABLE FORMS / GEOMETRY VIEW</div><span class="status">Mesh checked</span><div class="shadow"></div><canvas id="model" aria-label="Drag to rotate the model"></canvas></div><div class="controls"><div><h1>__TITLE__</h1><p id="dimensions"></p><button id="spin">Start rotation</button><button id="reset">Reset view</button><button id="png">Save PNG</button></div><div><label for="reveal">Reveal height <strong id="height"></strong></label><input id="reveal" type="range" min="0" max="100" value="100"><a href="model.3mf" download>3MF</a><a href="model.stl" download>STL</a><a href="parameters.json" download>Parameters</a></div><p class="note">Drag to orbit. Height reveal illustrates geometry; it is not a slicer simulation. Preview color is illustrative. Single-material model in millimeters. Not sliced or physically printed.</p><p id="error" role="alert"></p></div><script id="data" type="application/json">__DATA__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),{config,report,vertices,faces,normals}=data;
const canvas=document.getElementById('model'),gl=canvas.getContext('webgl',{antialias:true,preserveDrawingBuffer:true,alpha:true});
const slider=document.getElementById('reveal');
document.getElementById('dimensions').textContent=report.size_mm.map(x=>Math.round(x*10)/10).join(' × ')+' mm';
if(!gl){document.getElementById('error').textContent='WebGL is unavailable. Open the STL or 3MF in your model viewer.';}else{
const vs='attribute vec3 p;attribute vec3 n;uniform mat4 m;varying vec3 normal;varying float height;void main(){gl_Position=m*vec4(p,1.0);normal=mat3(m)*n;height=p.z;}';
const fs='precision mediump float;varying vec3 normal;varying float height;uniform vec3 color;uniform float cut;void main(){if(height>cut)discard;vec3 n=normalize(normal);float light=.42+.58*max(0.0,dot(n,normalize(vec3(-.35,.5,-.79))));float spec=.17*pow(max(0.0,dot(n,normalize(vec3(-.2,.3,-.93)))),30.0);gl_FragColor=vec4(color*light+vec3(spec),1.0);}';
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));gl.useProgram(program);
function buffer(name,values){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(values),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);}
buffer('p',faces.flatMap(f=>f.flatMap(i=>vertices[i])));buffer('n',faces.flatMap(f=>f.flatMap(i=>normals[i])));
const color=config.color.match(/[a-f0-9]{2}/gi).map(x=>parseInt(x,16)/255);gl.uniform3fv(gl.getUniformLocation(program,'color'),color);gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);
let yaw=.45,tilt=['nameplate','organizer'].includes(config.mode)?.94:.58,spin=false,drag=null,last=0;
const span=Math.max(Math.hypot(report.size_mm[0],report.size_mm[1]),report.size_mm[2]),center=report.size_mm[2]/2;
function draw(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);const w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const k=1.38/span,kx=k*Math.min(1,h/w),ky=k*Math.min(1,w/h),kz=1/(span*2),a=Math.cos(yaw),b=Math.sin(yaw),s=Math.sin(tilt),c=Math.cos(tilt);
const matrix=[a*kx,-b*s*ky,-b*c*kz,0,-b*kx,-a*s*ky,-a*c*kz,0,0,c*ky,-s*kz,0,0,-center*c*ky+.06,center*s*kz,1];
gl.uniformMatrix4fv(gl.getUniformLocation(program,'m'),false,matrix);const limit=report.size_mm[2]*Number(slider.value)/100;gl.uniform1f(gl.getUniformLocation(program,'cut'),limit);gl.drawArrays(gl.TRIANGLES,0,faces.length*3);document.getElementById('height').textContent=limit.toFixed(1)+' mm';}
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;tilt=Math.max(.1,Math.min(1.4,tilt+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY];draw();});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
slider.addEventListener('input',draw);document.getElementById('spin').onclick=()=>{spin=!spin;document.getElementById('spin').textContent=spin?'Pause rotation':'Start rotation';};document.getElementById('reset').onclick=()=>{yaw=.45;tilt=['nameplate','organizer'].includes(config.mode)?.94:.58;slider.value=100;draw();};document.getElementById('png').onclick=()=>{draw();const a=document.createElement('a');a.download='model-preview.png';a.href=canvas.toDataURL();a.click();};new ResizeObserver(draw).observe(canvas);function tick(t){if(spin&&!document.hidden&&t-last>32){yaw+=.012;draw();last=t;}requestAnimationFrame(tick);}draw();requestAnimationFrame(tick);
}
</script></body></html>
